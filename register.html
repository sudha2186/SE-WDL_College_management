<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark shadow">

<div class="container">

<a class="navbar-brand" href="index.html">

<i class="bi bi-calendar-event-fill"></i>

EventHub

</a>

<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">

<a class="nav-link" href="index.html">

Home

</a>

</li>

<li class="nav-item">

<a class="nav-link" href="events.html">

Events

</a>

</li>

<li class="nav-item">

<a class="nav-link active" href="register.html">

Register

</a>

</li>

<li class="nav-item">

<a class="nav-link" href="login.html">

Login

</a>

</li>

</ul>

</div>

</div>

</nav>

<!-- Registration -->

<section>

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-9">

<div class="form-container">

<h2 class="text-center mb-4">

Student Registration

</h2>

<form id="registrationForm">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

First Name

</label>

<input type="text"
id="fname"
class="form-control">

<small id="fnameError"
class="text-danger"></small>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Last Name

</label>

<input type="text"
id="lname"
class="form-control">

<small id="lnameError"
class="text-danger"></small>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Email

</label>

<input type="email"
id="email"
class="form-control">

<small id="emailError"
class="text-danger"></small>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Mobile Number

</label>

<input type="text"
id="mobile"
class="form-control">

<small id="mobileError"
class="text-danger"></small>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Date of Birth

</label>

<input type="date"
id="dob"
class="form-control">

<small id="dobError"
class="text-danger"></small>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Gender

</label>

<select id="gender"
class="form-select">

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<small id="genderError"
class="text-danger"></small>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Department

</label>

<select id="department"
class="form-select">

<option value="">Choose Department</option>

<option>Computer Engineering</option>

<option>IT</option>

<option>EXTC</option>

<option>Mechanical</option>

<option>Civil</option>

</select>

<small id="departmentError"
class="text-danger"></small>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Select Event

</label>

<select id="event"
class="form-select">

<option value="">Choose Event</option>

<option>Hackathon</option>

<option>AI Workshop</option>

<option>Robotics</option>

<option>Web Development</option>

<option>Coding Contest</option>

</select>

<small id="eventError"
class="text-danger"></small>

</div>

<div class="mb-3">

<label class="form-label">

Address

</label>

<textarea
id="address"
rows="3"
class="form-control"></textarea>

<small id="addressError"
class="text-danger"></small>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Password

</label>

<div class="input-group">

<input
type="password"
id="password"
class="form-control">

<button
type="button"
class="btn btn-outline-secondary"
onclick="toggleRegisterPassword()">

<i class="bi bi-eye-fill"></i>

</button>

</div>

<small id="passwordError"
class="text-danger"></small>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Confirm Password

</label>

<input
type="password"
id="confirmPassword"
class="form-control">

<small id="confirmError"
class="text-danger"></small>

</div>

</div>

<div class="form-check mb-4">

<input
type="checkbox"
id="terms"
class="form-check-input">

<label class="form-check-label">

I accept Terms & Conditions

</label>

<br>

<small id="termsError"
class="text-danger"></small>

</div>

<button
type="submit"
class="btn btn-primary w-100">

<i class="bi bi-person-plus-fill"></i>

Register

</button>

<div class="text-center mt-3">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</section>

<footer class="py-4">

<div class="container text-center">

© 2026 EventHub

</div>

</footer>

<script src="js/script.js"></script>

</body>

</html>
